#
# Runs after the owner merges a change to supported.json: tags every newly
# supported version as <upstream>+<patch set>, e.g. 3.4.1+cl-2026-10-18, and closes its release thread.
# Merging is the approval; this only records it.

name: Record release

on:
  push:
    branches: [main]
    paths: [supported.json]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Castling
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag newly supported versions
        run: tools/watch/tag-releases
